<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import {
  createRPG7, createRPGMaterials, RPG7_CONFIG,
  RPGEffects, WeaponAudio
} from './rpg_modul.js';

const K = RPG7_CONFIG;

/* ═══ КОНСТАНТЫ ═══ */
const CHARACTER_CONFIG = {
  skin: "#cf9a71", hair: "#2e2014", shirt: "#7f9fbd",
  pants: "#3d4a5e", shoes: "#1a1714",
};
const RPG_SCALE = K.SCALE;
const WALK_REF = 1.55;

const TPS = {
  SENS: 0.0026, PITCH_LIM: 1.15,
  DIST_IDLE: 3.4,  DIST_AIM: 1.85,
  SIDE_IDLE: 0.22, SIDE_AIM: 0.68,
  UP_IDLE:   1.10, UP_AIM:   0.55,
  CHEST:     1.35,
  LOOKAHEAD: 2.0,
  ENTER_DUR: 0.30, EXIT_DUR: 0.24, CAM_FOV: 52,
  SMOOTH_POS: 0.0008,
  SMOOTH_TGT: 0.0004,
  CROUCH_DROP: 0.30,
};
const FPS = { EYE_Y: 1.65, ADS_ENTER: 0.24, ADS_EXIT: 0.20, PITCH_LIM: 1.35 };

/* Model orientation:
   FPS  — как в модуле: rotY = +π/2 (дуло уходит в -Z камеры), модель в origin.
   TPS  — rotY = -π/2 (дуло уходит в +Z персонажа). Пистолетная рукоять модели
          находится в (-11.25, -3.55, 0). После rotY=-π/2 → (0, -3.55, -11.25).
          Умножаем на SCALE (0.009) → (0, -0.032, -0.101).
          Смещаем модель на +это, чтобы рукоять попала в origin wrapper. */
const RPG_ORIENT = {
  FPS: { rotY:  Math.PI / 2, pos: new THREE.Vector3(0, 0, 0) },
  TPS: { rotY: -Math.PI / 2, pos: new THREE.Vector3(0, 0.032, 0.101) },
};

/* ═══ RENDERER / SCENE / CAMERAS ═══ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d22);
scene.fog = new THREE.Fog(0x1a1d22, 16, 42);

const camera = new THREE.PerspectiveCamera(TPS.CAM_FOV, innerWidth / innerHeight, 0.05, 200);
camera.position.set(0, 2.0, -3.0);

const weaponScene = new THREE.Scene();
const weaponCamera = new THREE.PerspectiveCamera(K.WEAPON_FOV, innerWidth / innerHeight, 0.01, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.8;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.495;
controls.mouseButtons.RIGHT = null;
controls.update();

/* ═══ СВЕТ ═══ */
scene.add(new THREE.HemisphereLight(0xc8d4e8, 0x1a1e26, 1.15));
const keyLight = new THREE.DirectionalLight(0xfff4e2, 2.5);
keyLight.position.set(3.5, 5.5, 4.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5; keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -8; keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 8; keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0005; keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x5a86d8, 1.8);
rimLight.position.set(-3.5, 2.5, -3);
scene.add(rimLight);

weaponScene.add(new THREE.HemisphereLight(0xb0c0d8, 0x1a1e26, 1.3));
const wmKey = new THREE.DirectionalLight(0xfff0d8, 2.2); wmKey.position.set(1, 1.5, 1);
weaponScene.add(wmKey);
const wmRim = new THREE.DirectionalLight(0x5090ff, 1.0); wmRim.position.set(-1, 0.5, -1);
weaponScene.add(wmRim);

/* ═══ МИР ═══ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: 0x181d26, roughness: 0.95, metalness: 0.05 })
);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(60, 120, 0x2a3444, 0x1e2632);
grid.position.y = 0.002;
grid.material.transparent = true; grid.material.opacity = 0.4;
scene.add(grid);

const colliders = [];
const targetsGroup = new THREE.Group();
scene.add(targetsGroup);
const hittables = [ground];

(function buildTargets() {
  const postMat  = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9, metalness: 0.1 });
  const plateMat = new THREE.MeshStandardMaterial({ color: 0x9c2a1e, roughness: 0.5, metalness: 0.4 });
  const positions = [
    [ 6, 0, -10], [-5, 0, -12], [ 9, 0, -16],
    [-8, 0, -8],  [ 4, 0, -20], [-3, 0, -24]
  ];
  positions.forEach(([x, y, z]) => {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.6, 0.12), postMat);
    post.position.set(x, 0.8, z); post.castShadow = true;
    targetsGroup.add(post); hittables.push(post);
    const plate = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.08), plateMat.clone());
    plate.position.set(x, 1.7, z);
    plate.userData.isPlate = true; plate.castShadow = true;
    targetsGroup.add(plate); hittables.push(plate);
    colliders.push({
      min: new THREE.Vector3(x - 0.15, 0, z - 0.15),
      max: new THREE.Vector3(x + 0.15, 1.6, z + 0.15),
    });
  });
})();

/* ═══ ВОКСЕЛЬ-ТУЛКИТ ═══ */
const VOX = 0.034;
function hash3(x, y, z) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function dedupe(cells) {
  const seen = new Set(); const out = [];
  for (const c of cells) {
    const k = c[0] + '|' + c[1] + '|' + c[2];
    if (!seen.has(k)) { seen.add(k); out.push(c); }
  }
  return out;
}
function cellsToInstanced(cells, mat, baseHex, variation) {
  const geo = new THREE.BoxGeometry(VOX, VOX, VOX);
  const mesh = new THREE.InstancedMesh(geo, mat, cells.length);
  const m = new THREE.Matrix4(); const col = new THREE.Color();
  const base = new THREE.Color(baseHex);
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    m.makeTranslation(c[0] * VOX, c[1] * VOX, c[2] * VOX);
    mesh.setMatrixAt(i, m);
    const f = 1 + (hash3(c[0], c[1], c[2]) - 0.5) * variation;
    col.copy(base).multiplyScalar(f);
    mesh.setColorAt(i, col);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = true; mesh.receiveShadow = true; mesh.frustumCulled = false;
  return mesh;
}
function voxelSolidCyl(rTop, rBot, length, yOffset = 0, tol = 0.15) {
  const cells = []; const NL = Math.max(1, Math.round(length / VOX));
  const gMax = Math.ceil(Math.max(rTop, rBot) / VOX) + 1;
  for (let iy = 0; iy <= NL; iy++) {
    const t = iy / NL; const R = rTop + (rBot - rTop) * t;
    const gy = yOffset - iy;
    for (let gx = -gMax; gx <= gMax; gx++) for (let gz = -gMax; gz <= gMax; gz++) {
      const px = gx * VOX, pz = gz * VOX;
      if (px * px + pz * pz <= (R + VOX * tol) * (R + VOX * tol)) cells.push([gx, gy, gz]);
    }
  }
  return cells;
}
function voxelSolidSphere(r, yScale = 1) {
  const cells = []; const gMax = Math.ceil(r / VOX) + 1;
  for (let gx = -gMax; gx <= gMax; gx++)
    for (let gy = -gMax; gy <= gMax; gy++)
      for (let gz = -gMax; gz <= gMax; gz++) {
        const px = gx * VOX, py = gy * VOX / yScale, pz = gz * VOX;
        if (px * px + py * py + pz * pz <= r * r) cells.push([gx, gy, gz]);
      }
  return cells;
}

/* ═══ ПЛАЩ ═══ */
const COAT_MAT = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.78, metalness: 0.08 });
const COAT_BASE = 0x0e0e16;
const Y_TOP_G = Math.round(1.44 / VOX);
const HIP_G = Math.round(0.90 / VOX);
const COAT_NL = 36, MAXE = 10, GAP = 0.85, NSTR = 24;
const UPPER_CUT = Y_TOP_G - HIP_G;
const OUTER_PAD = VOX * 0.70, INNER_OFF = 0.040, WALL_TOL = 0.30;

function generateCoatCells() {
  const strandLen = [];
  for (let s = 0; s < NSTR; s++) {
    const smooth = Math.sin(s * 0.72) * 0.50 + Math.sin(s * 1.83 + 1.30) * 0.32 + Math.sin(s * 4.10 + 0.60) * 0.18;
    const r = hash3(s * 13 + 5, 7, 13);
    strandLen[s] = Math.max(0, Math.round(3.0 + smooth * 2.5 + (r - 0.5) * 4.5));
  }
  const sec = { upper: [], tailFL: [], tailFR: [], tailBL: [], tailBR: [] };
  for (let iy = 0; iy < COAT_NL + MAXE; iy++) {
    const t = Math.min(iy / (COAT_NL - 1), 1);
    const Rx = 0.215 + 0.025 * t, Rz = 0.135 + 0.020 * t;
    const gy = Y_TOP_G - iy; if (gy < 0) continue;
    const oRx = Rx + OUTER_PAD, oRz = Rz + OUTER_PAD;
    const iRx = Rx - INNER_OFF, iRz = Rz - INNER_OFF;
    const gxMax = Math.ceil(oRx / VOX) + 1, gzMax = Math.ceil(oRz / VOX) + 1;
    for (let gx = -gxMax; gx <= gxMax; gx++) for (let gz = -gzMax; gz <= gzMax; gz++) {
      const px = gx * VOX, pz = gz * VOX;
      if (Math.hypot(px / oRx, pz / oRz) > 1.0 + WALL_TOL * VOX) continue;
      if (Math.hypot(px / iRx, pz / iRz) < 1.0 - WALL_TOL * VOX) continue;
      const th = Math.atan2(px, pz);
      if (Math.abs(th) < GAP) continue;
      const u = (th + Math.PI) / (Math.PI * 2);
      const s = Math.floor(u * NSTR) % NSTR;
      if (iy - (COAT_NL - 1) > strandLen[s]) continue;
      const cell = [gx, gy, gz];
      if (iy < UPPER_CUT) sec.upper.push(cell);
      else if (th >= 0 && th < Math.PI / 2) sec.tailFR.push(cell);
      else if (th >= Math.PI / 2) sec.tailBR.push(cell);
      else if (th >= -Math.PI / 2 && th < 0) sec.tailFL.push(cell);
      else sec.tailBL.push(cell);
    }
  }
  return sec;
}
function generateCollarCells() {
  const cells = [];
  const COL_Y0 = Math.round(1.42 / VOX), COL_NL = 4, COL_GAP = 0.55;
  for (let iy = 0; iy <= COL_NL; iy++) {
    const t = iy / COL_NL;
    const Rx = 0.120 + 0.025 * t + OUTER_PAD, Rz = 0.092 + 0.020 * t + OUTER_PAD;
    const iRx = 0.120 + 0.025 * t - 0.035, iRz = 0.092 + 0.020 * t - 0.035;
    const gy = COL_Y0 + iy;
    const gxMax = Math.ceil(Rx / VOX) + 1, gzMax = Math.ceil(Rz / VOX) + 1;
    for (let gx = -gxMax; gx <= gxMax; gx++) for (let gz = -gzMax; gz <= gzMax; gz++) {
      const px = gx * VOX, pz = gz * VOX;
      if (Math.hypot(px / Rx, pz / Rz) > 1.0 + WALL_TOL * VOX) continue;
      if (Math.hypot(px / iRx, pz / iRz) < 1.0 - WALL_TOL * VOX) continue;
      const th = Math.atan2(px, pz);
      if (Math.abs(th) < COL_GAP) continue;
      cells.push([gx, gy, gz]);
    }
  }
  return cells;
}
function buildUpperSleeve() {
  return cellsToInstanced(dedupe([
    ...voxelSolidSphere(0.100, 0.85),
    ...voxelSolidCyl(0.090, 0.083, 0.34, 0)
  ]), COAT_MAT, COAT_BASE, 0.55);
}
function buildLowerSleeve() {
  return cellsToInstanced(dedupe([
    ...voxelSolidCyl(0.083, 0.076, 0.26, 0),
    ...voxelSolidCyl(0.100, 0.105, 0.10, -0.22)
  ]), COAT_MAT, COAT_BASE, 0.55);
}

/* ═══ ПЕРСОНАЖ ═══ */
const character = new THREE.Group(); scene.add(character);
const body = new THREE.Group(); character.add(body);
const upper = new THREE.Group(); upper.position.y = 0.90; body.add(upper);

const mat = (c, r = 0.85, m = 0.05) =>
  new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });

const mSkin  = mat(CHARACTER_CONFIG.skin);
const mHair  = mat(CHARACTER_CONFIG.hair, 0.94);
const mShirt = mat(CHARACTER_CONFIG.shirt, 0.92, 0.03);
const mPants = mat(CHARACTER_CONFIG.pants, 0.94, 0.03);
const mShoes = mat(CHARACTER_CONFIG.shoes, 0.85, 0.12);
const mDark  = mat(0x1a1714, 0.80, 0.15);
const mMetal = mat(0xa8a090, 0.32, 0.9);
const mLens  = new THREE.MeshPhysicalMaterial({
  color: 0x0a0a15, metalness: 1.0, roughness: 0.06,
  emissive: 0x101a30, emissiveIntensity: 0.35,
});

function box(parent, w, h, d, m, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
}

const HIP_Y = 0.90, THIGH_L = 0.42, SHIN_L = 0.38, LEG_T = 0.17;
function makeLeg(side) {
  const hip = new THREE.Group(); hip.position.set(side * 0.09, HIP_Y, 0); body.add(hip);
  box(hip, LEG_T, THIGH_L, LEG_T, mPants, 0, -THIGH_L / 2, 0);
  const knee = new THREE.Group(); knee.position.y = -THIGH_L; hip.add(knee);
  box(knee, LEG_T * 0.88, SHIN_L, LEG_T * 0.88, mPants, 0, -SHIN_L / 2, 0);
  const ankle = new THREE.Group(); ankle.position.y = -SHIN_L; knee.add(ankle);
  box(ankle, LEG_T * 1.05, 0.10, LEG_T * 1.7, mShoes, 0, -0.05, LEG_T * 0.30);
  return { hip, knee, ankle };
}
const legR = makeLeg( 1), legL = makeLeg(-1);

box(upper, 0.36, 0.55, 0.20, mShirt, 0, 0.275, 0);
box(upper, 0.38, 0.05, 0.21, mDark, 0, 0.020, 0);
box(upper, 0.045, 0.035, 0.018, mMetal, 0, 0.020, 0.106);
box(upper, 0.075, 0.10, 0.075, mSkin, 0, 0.600, 0);

const UPPERARM_L = 0.30, FOREARM_L = 0.28, ARM_T = 0.12;
function makeArm(side) {
  const shoulder = new THREE.Group(); shoulder.position.set(side * 0.24, 0.55, 0); upper.add(shoulder);
  box(shoulder, ARM_T, UPPERARM_L, ARM_T, mShirt, 0, -UPPERARM_L / 2, 0);
  const elbow = new THREE.Group(); elbow.position.y = -UPPERARM_L; shoulder.add(elbow);
  box(elbow, ARM_T * 0.92, FOREARM_L, ARM_T * 0.92, mShirt, 0, -FOREARM_L / 2, 0);
  const hand = new THREE.Group(); hand.position.y = -FOREARM_L; elbow.add(hand);
  box(hand, ARM_T * 0.85, ARM_T * 0.95, ARM_T * 0.90, mSkin, 0, -0.05, 0);
  box(hand, ARM_T * 0.30, ARM_T * 0.55, ARM_T * 0.32, mSkin, -side * ARM_T * 0.48, -0.03, ARM_T * 0.22);
  shoulder.add(buildUpperSleeve()); elbow.add(buildLowerSleeve());
  return { shoulder, elbow, hand };
}
const armR = makeArm( 1), armL = makeArm(-1);

const headBone = new THREE.Group(); headBone.position.set(0, 0.62, 0); upper.add(headBone);
const headGroup = new THREE.Group(); headGroup.position.y = 0.13; headBone.add(headGroup);

const HEAD_SIZE = 0.24, res = 7, voxel = HEAD_SIZE / res, half = (res - 1) / 2;
const vGeo = new THREE.BoxGeometry(voxel, voxel, voxel);
const inside = (nx, ny, nz) => {
  const taper = ny < -0.3 ? 0.76 : (ny < 0.1 ? 0.92 : 1.0);
  const mx = 0.86 * taper, mz = 1.00 * taper;
  if (Math.abs(nx) > mx || Math.abs(nz) > mz || Math.abs(ny) > 1.0) return false;
  const c = Math.pow(Math.abs(nx) / mx, 4) + Math.pow(Math.abs(nz) / mz, 4) + Math.pow(Math.abs(ny), 4) * 0.55;
  return c <= 1.65;
};
for (let ix = 0; ix < res; ix++) for (let iy = 0; iy < res; iy++) for (let iz = 0; iz < res; iz++) {
  const nx = (ix - half) / half, ny = (iy - half) / half, nz = (iz - half) / half;
  if (!inside(nx, ny, nz)) continue;
  let m = mSkin;
  if (ny > 0.55 || (nz < -0.25 && ny > -0.3) || (Math.abs(nx) > 0.6 && ny > 0.4)) m = mHair;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smoothstep = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const damp = (k, dt) => 1 - Math.pow(k, dt);

}

}

function tickWeaponState(dt) {
  weapon.time += dt;
  switch (weapon.state) {
    case 'drawing':
      if (weapon.time >= K.DRAW_DUR) { weapon.state = 'idle'; weapon.time = 0; }
      break;
    case 'holstering':
      if (weapon.time >= 0.55) {
        weapon.state = 'holstered';
        weapon.time = 0;
      }
      break;
    case 'reloading':
      tickReload();
      if (weapon.time >= K.RELOAD_DUR) {
        weapon.state = 'idle';
        weapon.time = 0;
        rpgRocketGroup.position.set(0, 0, 0);
        rpgRocketGroup.visible = true;
        emitAmmoHud();
      }
      break;
    case 'inspecting':
      if (weapon.time >= K.INSPECT_DUR) { weapon.state = 'idle'; weapon.time = 0; }
      break;
  }
}

/* ═══ ПЕРЕЗАРЯДКА — таймлайн из модуля ═══ */
function tickReload() {
  const t = weapon.time;
  const total = K.RELOAD_DUR;
  const F = rpgState.reload;

  /* Ракета вышла */
  if (!F.rocketOut && t >= 0.35) {
    F.rocketOut = true;
    rpgRocketGroup.visible = false;
    rpgAudio.click(0.30, 700, 0.09);
    setTimeout(() => rpgAudio.click(0.20, 400, 0.15), 120);
  }

  /* Новая ракета заходит */
  const newStart = 1.0;
  const newEnd = total - 0.5;
  if (t >= newStart && t < newEnd) {
    if (!F.newRocketIn) {
      F.newRocketIn = true;
      rpgRocketGroup.visible = true;
      rpgRocketGroup.position.set(0, -18, 4);
    }
    const u = smoothstep(newStart, newEnd, t);
    rpgRocketGroup.position.y = -18 * (1 - u);
    rpgRocketGroup.position.z =  4  * (1 - u);
    rpgRocketGroup.position.x =  0;
  }
  if (!F.ammoGiven && t >= newEnd - 0.1) {
    F.ammoGiven = true;
    rpgRocketGroup.position.set(0, 0, 0);
    rpgState.ammo    = 1;
    rpgState.reserve = Math.max(0, rpgState.reserve - 1);
    rpgAudio.click(0.35, 1100, 0.08);
    rpgAudio.click(0.30, 2200, 0.06);
    emitAmmoHud();
  }
}

function tryFire() {
  if (weapon.state !== 'idle') return;

  if (rpgState.ammo <= 0) {
    rpgAudio.click(0.22, 2800, 0.04);

  }

  rpgState.ammo = 0;
  emitAmmoHud();

  /* Направление */
  const dir = new THREE.Vector3();

    dir.set(Math.sin(look.yaw) * cosP, Math.sin(look.pitch), Math.cos(look.yaw) * cosP).normalize();
  } else {

  /* Мировые координаты дула */

  rpgAudio.launch();

/* ═══ IK ═══ */
const _ikDiff = new THREE.Vector3(), _ikU = new THREE.Vector3(), _ikPole = new THREE.Vector3();
const _ikE = new THREE.Vector3(), _ikUA = new THREE.Vector3(), _ikVA = new THREE.Vector3();
const _ikW = new THREE.Vector3(), _ikX = new THREE.Vector3(), _ikY = new THREE.Vector3();
const _ikZ = new THREE.Vector3(), _ikMat = new THREE.Matrix4();

function solveArmIK(shoulderPos, targetPos, L1, L2, poleDir, outQuat) {
  _ikDiff.subVectors(targetPos, shoulderPos);
  let d = _ikDiff.length();
  d = Math.max(Math.abs(L1 - L2) + 1e-4, Math.min(L1 + L2 - 1e-4, d));
  _ikU.copy(_ikDiff).normalize();

  const cosA = clamp((d * d - L1 * L1 - L2 * L2) / (2 * L1 * L2), -1, 1);
  const alpha = Math.acos(cosA);
  const elbowAngle = -alpha;

  _ikPole.copy(poleDir);
  _ikPole.addScaledVector(_ikU, -_ikPole.dot(_ikU));
  if (_ikPole.lengthSq() < 1e-8) {
    _ikPole.set(1, 0, 0).addScaledVector(_ikU, -_ikU.x);
    if (_ikPole.lengthSq() < 1e-8) _ikPole.set(0, 1, 0).addScaledVector(_ikU, -_ikU.y);
  }
  _ikPole.normalize();

  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  _ikE.copy(shoulderPos).addScaledVector(_ikU, a).addScaledVector(_ikPole, h);

  _ikUA.subVectors(_ikE, shoulderPos).normalize();
  _ikVA.subVectors(targetPos, _ikE).normalize();

  _ikW.copy(_ikVA).addScaledVector(_ikUA, -_ikVA.dot(_ikUA));
  if (_ikW.lengthSq() < 1e-8) {
    _ikW.set(0, 0, 1).cross(_ikUA);
    if (_ikW.lengthSq() < 1e-8) _ikW.set(1, 0, 0).cross(_ikUA);
  }
  _ikW.normalize();

  _ikX.crossVectors(_ikW, _ikUA);
  _ikY.copy(_ikUA).negate();
  _ikZ.copy(_ikW);
  _ikMat.makeBasis(_ikX, _ikY, _ikZ);
  outQuat.setFromRotationMatrix(_ikMat);
  return elbowAngle;
}

/* ═══ ВВОД ═══ */
addEventListener('keydown', e => {
  input.keys[e.code] = true;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.repeat) return;

  if (e.code === 'Digit1') drawWeapon();
  if (e.code === 'KeyV')   switchView(viewMode === 'third' ? 'first' : 'third');
  if (e.code === 'KeyR')   tryReload();
  if (e.code === 'KeyG')   tryInspect();
});
addEventListener('keyup', e => { input.keys[e.code] = false; });

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
  if (!pointerLocked) {
    input.lmb = false; input.rmb = false;
  }
});

addEventListener('mousedown', e => {
  if (e.button === 0) {
    input.lmb = true;
    rpgAudio.init(); rpgAudio.resume();
    if (!pointerLocked) renderer.domElement.requestPointerLock?.();
    if (weapon.state === 'inspecting') cancelInspect();
    if (weapon.state === 'idle') tryFire();
  }
  if (e.button === 2) {
    input.rmb = true;
    if (!pointerLocked) renderer.domElement.requestPointerLock?.();
    e.preventDefault();
  }
});

addEventListener('mouseup', e => {
  if (e.button === 0) { input.lmb = false; }
  if (e.button === 2) { input.rmb = false; e.preventDefault(); }
});

addEventListener('contextmenu', e => e.preventDefault());

addEventListener('mousemove', e => {
  if (!pointerLocked) return;

  const sensBase = viewMode === 'first' ? K.MOUSE_SENS : TPS.SENS;
  const sens = sensBase * (1 - weapon.adsAmount * (1 - K.MOUSE_ADS_MULT));
  look.yaw   -= e.movementX * sens;
  look.pitch -= e.movementY * sens;

  const pitchLimit = viewMode === 'first' ? FPS.PITCH_LIM : TPS.PITCH_LIM;
  look.pitch = clamp(look.pitch, -pitchLimit, pitchLimit);

  if (viewMode === 'first') {
    const swayScale = 1 - weapon.adsAmount * 0.95;
    fpsAnim.swayTarget.x += -e.movementX * 0.00035 * swayScale;
    fpsAnim.swayTarget.y +=  e.movementY * 0.00035 * swayScale;
    fpsAnim.swayTarget.x = clamp(fpsAnim.swayTarget.x, -0.035, 0.035);
    fpsAnim.swayTarget.y = clamp(fpsAnim.swayTarget.y, -0.035, 0.035);
  }
});

/* ═══ ДВИЖЕНИЕ ═══ */
const move = {
  speed: 0, phase: 0, moveBlend: 0,
  crouch: 0, crouchTarget: 0,
  sprint: 0, sprintTarget: 0,
  air: 0, grounded: true, vy: 0,
  baseY: 0, turnVel: 0,
};
const PLAYER_RADIUS = 0.42, PLAYER_HEIGHT = 1.7, WORLD_LIMIT = 26;

function resolveCollisions(pos) {
  const feet = pos.y - PLAYER_HEIGHT;
  for (const b of colliders) {
    if (feet > b.max.y - 0.05) continue;
    if (pos.y < b.min.y) continue;
    const cx = clamp(pos.x, b.min.x, b.max.x);
    const cz = clamp(pos.z, b.min.z, b.max.z);
    const dx = pos.x - cx, dz = pos.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 < PLAYER_RADIUS * PLAYER_RADIUS) {
      const d = Math.sqrt(d2);
      if (d > 0.0001) {
        const push = (PLAYER_RADIUS - d) / d;
        pos.x += dx * push; pos.z += dz * push;
      } else {
        pos.x += (pos.x < (b.min.x + b.max.x) / 2 ? -0.1 : 0.1);
      }
    }
  }
  pos.x = clamp(pos.x, -WORLD_LIMIT, WORLD_LIMIT);
  pos.z = clamp(pos.z, -WORLD_LIMIT, WORLD_LIMIT);
}

function updatePlayer(dt) {
  const isFPS = viewMode === 'first';
  const useLookBasis = isFPS || pointerLocked;

  /* A/D инвертированы */
  let ix = 0, iz = 0;
  if (input.keys.KeyW || input.keys.ArrowUp)    iz -= 1;
  if (input.keys.KeyS || input.keys.ArrowDown)  iz += 1;
  if (input.keys.KeyA || input.keys.ArrowLeft)  ix += 1;
  if (input.keys.KeyD || input.keys.ArrowRight) ix -= 1;

  const crouchKey = !!(input.keys.ControlLeft || input.keys.ControlRight || input.keys.KeyC);
  const sprintKey = !!(input.keys.ShiftLeft || input.keys.ShiftRight);
  const hasInput  = (ix !== 0 || iz !== 0);

  const moveDir = new THREE.Vector3();
  if (useLookBasis) {
    const fx = Math.sin(look.yaw), fz = Math.cos(look.yaw);
    const rx = fz, rz = -fx;
    if (hasInput) moveDir.set(fx * -iz + rx * ix, 0, fz * -iz + rz * ix).normalize();
  } else {
    const camFwd = new THREE.Vector3();
    camera.getWorldDirection(camFwd); camFwd.y = 0;
    if (camFwd.lengthSq() < 1e-6) camFwd.set(0, 0, -1);
    camFwd.normalize();
    const camRight = new THREE.Vector3().crossVectors(camFwd, new THREE.Vector3(0, 1, 0)).normalize();
    if (hasInput) moveDir.addScaledVector(camFwd, -iz).addScaledVector(camRight, ix).normalize();
  }

  move.crouchTarget = (crouchKey && move.grounded) ? 1 : 0;
  move.sprintTarget = (sprintKey && hasInput && !crouchKey && move.grounded && weapon.adsAmount < 0.5) ? 1 : 0;
  move.crouch += (move.crouchTarget - move.crouch) * Math.min(1, dt * 9);
  move.sprint += (move.sprintTarget - move.sprint) * Math.min(1, dt * 6);

  const canSprint = move.sprintTarget && weapon.adsAmount < 0.25;
  const effSprint = canSprint ? move.sprint : 0;

  const drawPenalty = (weapon.state === 'drawing' || weapon.state === 'holstering') ? 0.35 : 0;
  const baseSpeed = 1.55 * (1 - 0.55 * move.crouch) * (1 - drawPenalty)
                    * (1 - weapon.adsAmount * (1 - K.MOVE_ADS_MULT));
  const maxSpeed  = baseSpeed * (1 + effSprint * 1.35);
  const targetSpeed = hasInput ? maxSpeed : 0;
  move.speed += (targetSpeed - move.speed) * Math.min(1, dt * 9);

  const prevYaw = character.rotation.y;
  if (isFPS) {
    character.rotation.y = look.yaw;
  } else if (weapon.adsAmount > 0.15 || input.lmb || input.rmb) {
    let d = look.yaw - character.rotation.y;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    character.rotation.y += d * Math.min(1, dt * (4 + 10 * weapon.adsAmount));
  } else if (hasInput) {
    const targetYaw = Math.atan2(moveDir.x, moveDir.z);
    let d = targetYaw - character.rotation.y;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    character.rotation.y += d * Math.min(1, dt * 11);
  }
  let dyaw = character.rotation.y - prevYaw;
  dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
  move.turnVel += ((dyaw / Math.max(dt, 1e-4)) - move.turnVel) * Math.min(1, dt * 8);

  if (hasInput && move.speed > 0.002) {
    character.position.x += moveDir.x * move.speed * dt;
    character.position.z += moveDir.z * move.speed * dt;
  }
  resolveCollisions(character.position);

  if (input.keys.Space && move.grounded) { move.vy = 4.2; move.grounded = false; }
  if (!move.grounded) {
    move.vy -= 13.5 * dt;
    move.baseY += move.vy * dt;
    if (move.baseY <= 0) { move.baseY = 0; move.vy = 0; move.grounded = true; }
  }
  move.air += ((move.grounded ? 0 : 1) - move.air) * Math.min(1, dt * 12);

  if (move.grounded) {
    const cadence = 5.2 + effSprint * 4.0;
    move.phase += dt * cadence * Math.min(1.6, move.speed / 1.3);
  }
  const blendTarget = move.speed > 0.08 ? Math.min(1, move.speed / 1.2) : 0;
  move.moveBlend += (blendTarget - move.moveBlend) * Math.min(1, dt * 10);

  character.position.y = move.baseY;
  return { effSprint };
}

/* ═══ ADS + SPRING ═══ */
function updateAdsAndSpring(dt, isFPS) {
  if (isFPS) weapon.adsTarget = input.rmb ? 1 : 0;
  else       weapon.adsTarget = (input.lmb || input.rmb) ? 1 : 0;

  const dur = weapon.adsTarget > weapon.adsRaw ? (isFPS ? FPS.ADS_ENTER : TPS.ENTER_DUR)
                                               : (isFPS ? FPS.ADS_EXIT : TPS.EXIT_DUR);
  const step = dt / dur;
  if (weapon.adsRaw < weapon.adsTarget)      weapon.adsRaw = Math.min(weapon.adsTarget, weapon.adsRaw + step);
  else if (weapon.adsRaw > weapon.adsTarget) weapon.adsRaw = Math.max(weapon.adsTarget, weapon.adsRaw - step);
  weapon.adsAmount = smoothstep(0, 1, weapon.adsRaw);

  if (isFPS) {
    fpsAnim.swayCurrent.x += (fpsAnim.swayTarget.x - fpsAnim.swayCurrent.x) * Math.min(dt * 9, 1);
    fpsAnim.swayCurrent.y += (fpsAnim.swayTarget.y - fpsAnim.swayCurrent.y) * Math.min(dt * 9, 1);
    fpsAnim.swayTarget.multiplyScalar(1 - Math.min(dt * 2.2, 1));

    const walkSpeed = move.speed;
    const targetBob = move.grounded ? Math.min(walkSpeed / WALK_REF, 1.4) : 0;
    fpsAnim.bobAmount += (targetBob - fpsAnim.bobAmount) * Math.min(dt * 8, 1);
    fpsAnim.bobTime += dt * (6.0 + walkSpeed * 1.1);
    fpsAnim.breatheTime += dt;
  }

  const stiff = 220, dampK = 17;
  anim.kickPosVel.addScaledVector(anim.kickPos, -stiff * dt);
  anim.kickPosVel.multiplyScalar(Math.max(0, 1 - dampK * dt));
  anim.kickPos.addScaledVector(anim.kickPosVel, dt);

  anim.kickRotVel.addScaledVector(anim.kickRot, -stiff * dt);
  anim.kickRotVel.multiplyScalar(Math.max(0, 1 - dampK * dt));
  anim.kickRot.addScaledVector(anim.kickRotVel, dt);

  anim.camShakeVel.multiplyScalar(Math.max(0, 1 - (isFPS ? 5 : 6) * dt));
  anim.camShake.addScaledVector(anim.camShakeVel, dt * (isFPS ? 0.012 : 0.010));
  anim.camShake.multiplyScalar(Math.max(0, 1 - (isFPS ? 6 : 7) * dt));
}

/* ═══ ПОЗА ПЕРСОНАЖА ═══ */
const _walkQuatR = new THREE.Quaternion();
const _walkQuatL = new THREE.Quaternion();
const _ikQuatR   = new THREE.Quaternion();
const _ikQuatL   = new THREE.Quaternion();

function updateCharacterPose(dt, t, effSprint) {
  const p = move.phase, moveB = move.moveBlend, c = move.crouch, air = move.air, sp = effSprint;

  const legAmp  = (0.55 + 0.20 * sp) * moveB * (1 - 0.30 * c);
  const kneeAmp = (0.75 + 0.30 * sp) * moveB * (1 - 0.25 * c);
  const crouchHip = -0.85 * c, crouchKnee = 1.55 * c;
  const airHip = -0.45 * air,  airKnee = 0.85 * air;

  const hipR = -legAmp * Math.sin(p);
  const hipL = -legAmp * Math.sin(p + Math.PI);
  const kneeR = Math.max(0, kneeAmp * Math.sin(p + 0.9)) + 0.06;
  const kneeL = Math.max(0, kneeAmp * Math.sin(p + 0.9 + Math.PI)) + 0.06;

  legR.hip.rotation.x  = hipR + crouchHip + airHip;
  legL.hip.rotation.x  = hipL + crouchHip + airHip;
  legR.knee.rotation.x = kneeR + crouchKnee + airKnee;
  legL.knee.rotation.x = kneeL + crouchKnee + airKnee;
  legR.ankle.rotation.x = -(legR.hip.rotation.x + legR.knee.rotation.x) * 0.85;
  legL.ankle.rotation.x = -(legL.hip.rotation.x + legL.knee.rotation.x) * 0.85;

  const aimTorsoPitch = look.pitch * 0.20 * weapon.adsAmount;
  const fireLean = 0.03;
  const torsoLean = (0.10 * moveB * (1 + sp * 0.9) + 0.20 * c + fireLean * (input.lmb ? 1 : 0)) * (1 - weapon.adsAmount * 0.5);
  upper.rotation.x = torsoLean + aimTorsoPitch;
  upper.rotation.z = Math.sin(p * 2) * 0.012 * moveB;

  headBone.rotation.x = -upper.rotation.x * 0.55 - weapon.adsAmount * 0.05 - look.pitch * 0.75 * weapon.adsAmount;
  headBone.rotation.y = Math.sin(t * 0.55) * 0.03 * (1 - moveB);

  const speedFactor = Math.min(1, move.speed / 1.8);
  const lagBack = 0.45 * speedFactor * (1 + sp * 0.45);
  const sideLag = clamp(move.turnVel * 0.22, -0.35, 0.35);
  const swayZ = Math.sin(p * 2) * 0.06 * moveB;
  const swayY = Math.sin(p * 2 + 1) * 0.04 * moveB;
  const airFlare = 0.55 * air;

  coatTailFR.rotation.x = lagBack * 1.15 + Math.sin(p * 2 + 0.3) * 0.07 * moveB + airFlare * 0.6;
  coatTailFR.rotation.z = sideLag * 1.10 + swayZ * 0.5 + 0.03;
  coatTailFR.rotation.y = swayY * 0.5;
  coatTailFL.rotation.x = lagBack * 1.15 + Math.sin(p * 2 + 0.6) * 0.07 * moveB + airFlare * 0.6;
  coatTailFL.rotation.z = sideLag * 1.10 + swayZ * 0.5 - 0.03;
  coatTailFL.rotation.y = -swayY * 0.5;
  coatTailBR.rotation.x = lagBack * 0.95 + Math.sin(p * 2 + 0.9) * 0.09 * moveB + airFlare * 0.45;
  coatTailBR.rotation.z = sideLag * 0.90 + swayZ * 0.6 + 0.03;
  coatTailBR.rotation.y = swayY * 0.6;
  coatTailBL.rotation.x = lagBack * 0.95 + Math.sin(p * 2 + 1.2) * 0.09 * moveB + airFlare * 0.45;
  coatTailBL.rotation.z = sideLag * 0.90 + swayZ * 0.6 - 0.03;
  coatTailBL.rotation.y = -swayY * 0.6;

  const legLift = (Math.abs(hipR) + Math.abs(hipL)) * 0.08;
  const bob = Math.sin(p * 2) * 0.012 * moveB;
  const breath = Math.sin(t * 1.4) * 0.006 * (1 - moveB);
  body.position.y = -TPS.CROUCH_DROP * c - legLift + bob + breath;
}

/* ═══ FPS VIEWMODEL ═══ */
const _tmpPos  = new THREE.Vector3();
const _tmpQuat = new THREE.Quaternion();
const _kickQ   = new THREE.Quaternion();
const _kickE   = new THREE.Euler();

function updateFPSWeapon(dt) {
  const pos = _tmpPos.copy(FPS_POS_BASE).lerp(FPS_POS_ADS, weapon.adsAmount);
  const quat = _tmpQuat.copy(FPS_QUAT_BASE).slerp(FPS_QUAT_ADS, weapon.adsAmount);

  const swayMul = 1 - weapon.adsAmount * 0.95;
  pos.x += fpsAnim.swayCurrent.x * swayMul;
  pos.y += fpsAnim.swayCurrent.y * swayMul;
  quat.multiply(_kickQ.setFromEuler(_kickE.set(0, fpsAnim.swayCurrent.x * 1.4 * swayMul, 0, 'XYZ')));
  quat.multiply(_kickQ.setFromEuler(_kickE.set(fpsAnim.swayCurrent.y * 1.4 * swayMul, 0, 0, 'XYZ')));

  const bobMul = 1 - weapon.adsAmount * 0.92;
  pos.x += Math.sin(fpsAnim.bobTime) * 0.0125 * fpsAnim.bobAmount * bobMul;
  pos.y += (Math.abs(Math.cos(fpsAnim.bobTime)) * 0.0105 * fpsAnim.bobAmount - 0.004 * fpsAnim.bobAmount) * bobMul;
  quat.multiply(_kickQ.setFromEuler(_kickE.set(
    Math.abs(Math.cos(fpsAnim.bobTime)) * 0.008 * fpsAnim.bobAmount * bobMul,
    0,
    Math.sin(fpsAnim.bobTime) * 0.020 * fpsAnim.bobAmount * bobMul,
    'XYZ'
  )));

  const idleAmount = 1 - Math.min(fpsAnim.bobAmount, 1);
  pos.y += Math.sin(fpsAnim.breatheTime * 1.35) * 0.0022 * idleAmount;
  pos.x += Math.sin(fpsAnim.breatheTime * 0.85) * 0.0016 * idleAmount;

  if (weapon.state === 'drawing') {
    const k = 1 - easeOutCubic(Math.min(weapon.time / K.DRAW_DUR, 1));
    pos.y -= k * 0.65; pos.z += k * 0.15;
    quat.multiply(_kickQ.setFromEuler(_kickE.set(-k * 1.15, 0, k * 0.40, 'XYZ')));
  }
  if (weapon.state === 'holstering') {
    const k = easeOutCubic(Math.min(weapon.time / 0.55, 1));
    pos.y -= k * 0.65; pos.z += k * 0.15;
    quat.multiply(_kickQ.setFromEuler(_kickE.set(-k * 1.15, 0, k * 0.40, 'XYZ')));
  }

  if (weapon.state === 'inspecting') {
    const kT = weapon.time * (K.INSPECT_END / K.INSPECT_DUR);
    const keys = K.INSPECT_KEYS;
    let k0 = keys[0], k1 = keys[keys.length - 1];
    for (let i = 0; i < keys.length - 1; i++) {
      if (kT >= keys[i].t && kT <= keys[i + 1].t) { k0 = keys[i]; k1 = keys[i + 1]; break; }
    }
    const lt = smoothstep(k0.t, k1.t, kT);
    fpsAnim.inspectOffsetPos.set(
      k0.p[0] + (k1.p[0] - k0.p[0]) * lt,
      k0.p[1] + (k1.p[1] - k0.p[1]) * lt,
      k0.p[2] + (k1.p[2] - k0.p[2]) * lt
    );
    fpsAnim.inspectOffsetRot.set(
      k0.r[0] + (k1.r[0] - k0.r[0]) * lt,
      k0.r[1] + (k1.r[1] - k0.r[1]) * lt,
      k0.r[2] + (k1.r[2] - k0.r[2]) * lt
    );
    fpsAnim.inspectActive = true;
  } else if (fpsAnim.inspectActive) {
    const k = Math.min(dt * 16, 1);
    fpsAnim.inspectOffsetPos.multiplyScalar(1 - k);
    fpsAnim.inspectOffsetRot.multiplyScalar(1 - k);
    if (fpsAnim.inspectOffsetPos.lengthSq() < 1e-6 && fpsAnim.inspectOffsetRot.lengthSq() < 1e-6) {
      fpsAnim.inspectOffsetPos.set(0, 0, 0);
      fpsAnim.inspectOffsetRot.set(0, 0, 0);
      fpsAnim.inspectActive = false;
    }
  }
  pos.add(fpsAnim.inspectOffsetPos);
  quat.multiply(_kickQ.setFromEuler(_kickE.set(
    fpsAnim.inspectOffsetRot.x, fpsAnim.inspectOffsetRot.y, fpsAnim.inspectOffsetRot.z, 'XYZ'
  )));

  if (weapon.state === 'reloading') {
    const rT = weapon.time;
    const total = K.RELOAD_DUR;
    const tiltIn  = smoothstep(0.0, 0.25, rT);
    const tiltOut = 1 - smoothstep(total - 0.5, total, rT);
    const tilt = tiltIn * tiltOut;
    pos.z += 0.06 * tilt; pos.y -= 0.10 * tilt; pos.x -= 0.03 * tilt;
    if (rT > 0.4 && rT < total - 0.6) pos.y += Math.sin(rT * 18) * 0.004 * tilt;
    quat.multiply(_kickQ.setFromEuler(_kickE.set(0.20 * tilt, -0.25 * tilt, 0.55 * tilt, 'XYZ')));
  }

  pos.x += anim.kickPos.x;
  pos.y += anim.kickPos.y;
  pos.z += anim.kickPos.z;
  quat.multiply(_kickQ.setFromEuler(_kickE.set(-anim.kickRot.x, anim.kickRot.y, anim.kickRot.z, 'XYZ')));

  gunWrapper.position.copy(pos);
  gunWrapper.quaternion.copy(quat);
}

/* ═══ TPS WEAPON ═══ */
const _xAxis = new THREE.Vector3(1, 0, 0);
const _pitchQ = new THREE.Quaternion();

function updateTPSWeapon(dt) {
  let drawProgress = 0;
  switch (weapon.state) {
    case 'holstered':  drawProgress = 0; break;
    case 'drawing':    drawProgress = Math.min(1, weapon.time / K.DRAW_DUR); break;
    case 'holstering': drawProgress = 1 - Math.min(1, weapon.time / 0.55); break;
    default:           drawProgress = 1;
  }
  drawProgress = smoothstep(0, 1, drawProgress);

  const heldPos  = new THREE.Vector3().lerpVectors(TPS_POSES.HELD, TPS_POSES.ADS, weapon.adsAmount);
  const heldQuat = new THREE.Quaternion().slerpQuaternions(TPS_QUAT_HELD, TPS_QUAT_ADS, weapon.adsAmount);

  const gunPos  = new THREE.Vector3().lerpVectors(TPS_POSES.BACK, heldPos, drawProgress);
  const gunQuat = new THREE.Quaternion().slerpQuaternions(TPS_QUAT_BACK, heldQuat, drawProgress);

  const arc = Math.sin(drawProgress * Math.PI);
  gunPos.x += arc * 0.60;
  gunPos.y += arc * 0.12;
  gunPos.z -= arc * 0.10;

  if (weapon.adsAmount > 0.001) {
    _pitchQ.setFromAxisAngle(_xAxis, -look.pitch * weapon.adsAmount);
    gunQuat.multiply(_pitchQ);
  }

  gunPos.x += anim.kickPos.x;
  gunPos.y += anim.kickPos.y;
  gunPos.z -= anim.kickPos.z;
  if (anim.kickRot.lengthSq() > 1e-8) {
    _kickE.set(-anim.kickRot.x, anim.kickRot.y, anim.kickRot.z, 'XYZ');
    _kickQ.setFromEuler(_kickE);
    gunQuat.multiply(_kickQ);
  }

  if (weapon.state === 'reloading') {
    const rT = weapon.time;
    const total = K.RELOAD_DUR;
    const tiltIn  = smoothstep(0.0, 0.25, rT);
    const tiltOut = 1 - smoothstep(total - 0.5, total, rT);
    const tilt = tiltIn * tiltOut;
    gunPos.z += 0.06 * tilt; gunPos.y -= 0.10 * tilt; gunPos.x -= 0.03 * tilt;
    if (rT > 0.4 && rT < total - 0.6) gunPos.y += Math.sin(rT * 18) * 0.004 * tilt;
    _kickE.set(0.20 * tilt, -0.25 * tilt, 0.55 * tilt, 'XYZ');
    _kickQ.setFromEuler(_kickE);
    gunQuat.multiply(_kickQ);
  }

  if (weapon.state === 'inspecting') {
    const kT = weapon.time * (K.INSPECT_END / K.INSPECT_DUR);
    const keys = K.INSPECT_KEYS;
    let k0 = keys[0], k1 = keys[keys.length - 1];
    for (let i = 0; i < keys.length - 1; i++) {
      if (kT >= keys[i].t && kT <= keys[i + 1].t) { k0 = keys[i]; k1 = keys[i + 1]; break; }
    }
    const lt = smoothstep(k0.t, k1.t, kT);
    const ip = new THREE.Vector3(
      k0.p[0] + (k1.p[0] - k0.p[0]) * lt,
      k0.p[1] + (k1.p[1] - k0.p[1]) * lt,
      k0.p[2] + (k1.p[2] - k0.p[2]) * lt
    );
    const ir = new THREE.Vector3(
      k0.r[0] + (k1.r[0] - k0.r[0]) * lt,
      k0.r[1] + (k1.r[1] - k0.r[1]) * lt,
      k0.r[2] + (k1.r[2] - k0.r[2]) * lt
    );
    gunPos.add(ip);
    _kickE.set(ir.x, ir.y, ir.z, 'XYZ');
    _kickQ.setFromEuler(_kickE);
    gunQuat.multiply(_kickQ);
  }

  gunWrapper.position.copy(gunPos);
  gunWrapper.quaternion.copy(gunQuat);

  /* IK */
  const p = move.phase, moveB = move.moveBlend, c = move.crouch, air = move.air, sp = move.sprint;
  const armAmp   = (0.40 + 0.24 * sp) * moveB * (1 - 0.30 * c);
  const elbowAmp = (0.35 + 0.30 * sp) * moveB;

  const walkShoulderR = armAmp * Math.sin(p);
  const walkShoulderL = armAmp * Math.sin(p + Math.PI);
  const walkElbowR = -0.15 - elbowAmp * Math.max(0, -Math.sin(p)) - 0.35 * air - 0.20 * c;
  const walkElbowL = -0.15 - elbowAmp * Math.max(0, -Math.sin(p + Math.PI)) - 0.35 * air - 0.20 * c;
  const walkSideR =  0.05 + 0.05 * sp + 0.12 * air;
  const walkSideL = -0.05 - 0.05 * sp - 0.12 * air;

  _walkQuatR.setFromEuler(new THREE.Euler(walkShoulderR - 0.12 * c - 0.55 * air, 0, walkSideR, 'XYZ'));
  _walkQuatL.setFromEuler(new THREE.Euler(walkShoulderL - 0.12 * c - 0.55 * air, 0, walkSideL, 'XYZ'));

  const rightTarget = gunPos.clone().add(RIGHT_HAND_LOCAL.clone().applyQuaternion(gunQuat));
  const leftTarget  = gunPos.clone().add(LEFT_HAND_LOCAL.clone().applyQuaternion(gunQuat));

  const blendR = smoothstep(0.15, 0.60, drawProgress);
  const blendL = smoothstep(0.30, 0.80, drawProgress);

  if (blendR > 0.001) {
    const elbowIK = solveArmIK(SHOULDER_R, rightTarget, UPPERARM_L, FOREARM_L, POLE_R, _ikQuatR);
    armR.shoulder.quaternion.copy(_walkQuatR).slerp(_ikQuatR, blendR);
    armR.elbow.rotation.x = walkElbowR * (1 - blendR) + elbowIK * blendR;
  } else {
    armR.shoulder.quaternion.copy(_walkQuatR);
    armR.elbow.rotation.x = walkElbowR;
  }
  if (blendL > 0.001) {
    const elbowIK = solveArmIK(SHOULDER_L, leftTarget, UPPERARM_L, FOREARM_L, POLE_L, _ikQuatL);
    armL.shoulder.quaternion.copy(_walkQuatL).slerp(_ikQuatL, blendL);
    armL.elbow.rotation.x = walkElbowL * (1 - blendL) + elbowIK * blendL;
  } else {
    armL.shoulder.quaternion.copy(_walkQuatL);
    armL.elbow.rotation.x = walkElbowL;
  }
}

/* ═══ КАМЕРЫ ═══ */
function updateFPSCamera(dt) {
  camera.position.set(
    character.position.x,
    character.position.y + FPS.EYE_Y,
    character.position.z
  );
  camera.rotation.set(look.pitch, look.yaw + Math.PI, 0, 'YXZ');
  camera.rotation.x += anim.camShake.x * 0.012;
  camera.rotation.y += anim.camShake.y * 0.012;
  camera.rotation.z += anim.camShake.z * 0.012;

  const targetFov  = K.MAIN_FOV   + weapon.adsAmount * K.ADS_FOV_DELTA;
  const targetWFov = K.WEAPON_FOV + weapon.adsAmount * K.WEAPON_ADS_FOV_DELTA;
  if (Math.abs(camera.fov - targetFov) > 0.05) {
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 8);
    camera.updateProjectionMatrix();
  }
  if (Math.abs(weaponCamera.fov - targetWFov) > 0.05) {
    weaponCamera.fov += (targetWFov - weaponCamera.fov) * Math.min(1, dt * 8);
    weaponCamera.updateProjectionMatrix();
  }
}

const _gtaDir   = new THREE.Vector3();
const _gtaRight = new THREE.Vector3();

function updateTPSCamera(dt) {
  const cosP = Math.cos(look.pitch);
  _gtaDir.set(
    Math.sin(look.yaw) * cosP,
    Math.sin(look.pitch),
    Math.cos(look.yaw) * cosP
  ).normalize();
  _gtaRight.set(Math.cos(look.yaw), 0, -Math.sin(look.yaw));

  const anchorX = character.position.x;
  const anchorY = character.position.y - TPS.CROUCH_DROP * move.crouch + TPS.CHEST;
  const anchorZ = character.position.z;

  const dist = lerp(TPS.DIST_IDLE, TPS.DIST_AIM, weapon.adsAmount);
  const side = lerp(TPS.SIDE_IDLE, TPS.SIDE_AIM, weapon.adsAmount);
  const up   = lerp(TPS.UP_IDLE,   TPS.UP_AIM,   weapon.adsAmount);

  const desiredX = anchorX - _gtaDir.x * dist + _gtaRight.x * side;
  const desiredY = anchorY - _gtaDir.y * dist + up;
  const desiredZ = anchorZ - _gtaDir.z * dist + _gtaRight.z * side;

  if (!camSmooth.init) {
    camSmooth.pos.set(desiredX, desiredY, desiredZ);
    camSmooth.target.set(anchorX, anchorY, anchorZ);
    camSmooth.init = true;
  } else {
    const kp = damp(TPS.SMOOTH_POS, dt);
    const kt = damp(TPS.SMOOTH_TGT, dt);
    camSmooth.pos.x += (desiredX - camSmooth.pos.x) * kp;
    camSmooth.pos.y += (desiredY - camSmooth.pos.y) * kp;
    camSmooth.pos.z += (desiredZ - camSmooth.pos.z) * kp;
    camSmooth.target.x += (anchorX - camSmooth.target.x) * kt;
    camSmooth.target.y += (anchorY - camSmooth.target.y) * kt;
    camSmooth.target.z += (anchorZ - camSmooth.target.z) * kt;
  }

  camera.position.copy(camSmooth.pos);
  camera.position.x += anim.camShake.x * 0.03;
  camera.position.y += anim.camShake.y * 0.03;
  camera.position.z += anim.camShake.z * 0.03;

  const lx = camSmooth.target.x + _gtaDir.x * TPS.LOOKAHEAD;
  const ly = camSmooth.target.y + _gtaDir.y * TPS.LOOKAHEAD;
  const lz = camSmooth.target.z + _gtaDir.z * TPS.LOOKAHEAD;
  camera.lookAt(lx, ly, lz);

  const targetFov = TPS.CAM_FOV - weapon.adsAmount * 12;
  if (Math.abs(camera.fov - targetFov) > 0.05) {
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 8);
    camera.updateProjectionMatrix();
  }
}

/* ═══ ГЛАВНЫЙ ЦИКЛ ═══ */
const clock = new THREE.Clock();

function update(dt, t) {
  const isFPS = viewMode === 'first';

  tickWeaponState(dt);
  const { effSprint } = updatePlayer(dt);
  updateAdsAndSpring(dt, isFPS);
  updateCharacterPose(dt, t, effSprint);

  if (isFPS) updateFPSWeapon(dt);
  else       updateTPSWeapon(dt);

  if (isFPS) updateFPSCamera(dt);
  else       updateTPSCamera(dt);

  if (rpgState.fireCooldown > 0) rpgState.fireCooldown -= dt;

  updateMuzzleFlash(dt);
  rpgEffects.update(dt);

  const crossOpacity = isFPS ? (0.55 + weapon.adsAmount * 0.45) : weapon.adsAmount;
  crossEl.style.opacity = String(crossOpacity);

  emitAmmoHud();
}

function animate() {
  const dt = Math.min(clock.getDelta(), 0.033);
  const t = clock.elapsedTime;
  update(dt, t);

  if (viewMode === 'first') {
    renderer.autoClear = false;
    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(weaponScene, weaponCamera);
  } else {
    renderer.autoClear = true;
    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);
}

applyModelOrientation('third');
refreshMuzzleLocal();
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  weaponCamera.aspect = innerWidth / innerHeight;
  weaponCamera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
