<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   CONFIG
   ============================================================ */
const CHARACTER_CONFIG = {
  skin:  "#cf9a71",
  hair:  "#2e2014",
  shirt: "#7f9fbd",
  pants: "#3d4a5e",
  shoes: "#1a1714",

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */

const scene = new THREE.Scene();

/* ============================================================

scene.add(new THREE.HemisphereLight(0xc8d4e8, 0x1a1e26, 1.15));

const keyLight = new THREE.DirectionalLight(0xfff4e2, 2.5);
keyLight.position.set(3.5, 5.5, 4.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far  = 20;
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0005;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x5a86d8, 1.8);
rimLight.position.set(-3.5, 2.5, -3);
scene.add(rimLight);

/* ============================================================
   GROUND
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(20, 64),
  new THREE.MeshStandardMaterial({ color: 0x181d26, roughness: 0.95, metalness: 0.05 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(40, 80, 0x2a3444, 0x1e2632);
grid.position.y = 0.002;
grid.material.transparent = true;
grid.material.opacity = 0.4;
scene.add(grid);

/* ============================================================
   VOXEL TOOLKIT
   ============================================================ */
const VOX = 0.034;

function hash3(x, y, z) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

function dedupe(cells) {
  const seen = new Set();
  const out  = [];
  for (const c of cells) {
    const k = c[0] + '|' + c[1] + '|' + c[2];
    if (!seen.has(k)) { seen.add(k); out.push(c); }
  }
  return out;
}

function cellsToInstanced(cells, mat, baseHex, variation) {
  const geo  = new THREE.BoxGeometry(VOX, VOX, VOX);
  const mesh = new THREE.InstancedMesh(geo, mat, cells.length);
  const m    = new THREE.Matrix4();
  const col  = new THREE.Color();
  const base = new THREE.Color(baseHex);

  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    m.makeTranslation(c[0] * VOX, c[1] * VOX, c[2] * VOX);
    mesh.setMatrixAt(i, m);
    const f = 1 + (hash3(c[0], c[1], c[2]) - 0.5) * variation;
    col.copy(base).multiplyScalar(f);
    mesh.setColorAt(i, col);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.frustumCulled = false;
  return mesh;
}

function voxelSolidCyl(rTop, rBot, length, yOffset = 0, tol = 0.15) {
  const cells = [];
  const NL    = Math.max(1, Math.round(length / VOX));
  const gMax  = Math.ceil(Math.max(rTop, rBot) / VOX) + 1;
  for (let iy = 0; iy <= NL; iy++) {
    const t  = iy / NL;
    const R  = rTop + (rBot - rTop) * t;
    const gy = yOffset - iy;
    for (let gx = -gMax; gx <= gMax; gx++) {
      for (let gz = -gMax; gz <= gMax; gz++) {
        const px = gx * VOX, pz = gz * VOX;
        if (px * px + pz * pz <= (R + VOX * tol) * (R + VOX * tol)) {
          cells.push([gx, gy, gz]);
        }
      }
    }
  }
  return cells;
}

function voxelSolidSphere(r, yScale = 1) {
  const cells = [];
  const gMax  = Math.ceil(r / VOX) + 1;
  for (let gx = -gMax; gx <= gMax; gx++)
    for (let gy = -gMax; gy <= gMax; gy++)
      for (let gz = -gMax; gz <= gMax; gz++) {
        const px = gx * VOX, py = gy * VOX / yScale, pz = gz * VOX;
        if (px * px + py * py + pz * pz <= r * r) cells.push([gx, gy, gz]);
      }
  return cells;
}

/* ============================================================
   VOXEL COAT — СУЖЕН
   ============================================================
   Было:  Rx = 0.225 + 0.095*t  →  0.225 → 0.320
          Rz = 0.145 + 0.075*t  →  0.145 → 0.220
   Стало: Rx = 0.215 + 0.025*t  →  0.215 → 0.240   (ниже на 25%)
          Rz = 0.135 + 0.020*t  →  0.135 → 0.155   (уже на 30%)

   Верх остался почти на месте — плечи не торчат из-под пальто,
   а низ больше не раздувается колоколом.
   ============================================================ */
const COAT_MAT = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 0.78, metalness: 0.08
});
const COAT_BASE   = 0x0e0e16;
const COLLAR_BASE = 0x15151c;

const Y_TOP     = 1.44;
const Y_TOP_G   = Math.round(Y_TOP / VOX);         // 42
const HIP_G     = Math.round(0.90 / VOX);          // 26
const COAT_NL   = 36;
const MAXE      = 10;
const GAP       = 0.85;
const NSTR      = 24;
const UPPER_CUT = Y_TOP_G - HIP_G;                 // 16

const OUTER_PAD = VOX * 0.70;
const INNER_OFF = 0.040;
const WALL_TOL  = 0.30;

function generateCoatCells() {
  const strandLen = [];
  for (let s = 0; s < NSTR; s++) {
    const smooth =
      Math.sin(s * 0.72)        * 0.50 +
      Math.sin(s * 1.83 + 1.30) * 0.32 +
      Math.sin(s * 4.10 + 0.60) * 0.18;
    const r = hash3(s * 13 + 5, 7, 13);
    strandLen[s] = Math.max(0, Math.round(3.0 + smooth * 2.5 + (r - 0.5) * 4.5));
  }

  const sections = {
    upper: [],
    tailFL: [],
    tailFR: [],
    tailBL: [],
    tailBR: [],
  };

  for (let iy = 0; iy < COAT_NL + MAXE; iy++) {
    const t  = Math.min(iy / (COAT_NL - 1), 1);

    /* >>> СУЖЕНИЕ <<< */
    const Rx = 0.215 + 0.025 * t;
    const Rz = 0.135 + 0.020 * t;

    const gy = Y_TOP_G - iy;
    if (gy < 0) continue;

    const outerRx = Rx + OUTER_PAD;
    const outerRz = Rz + OUTER_PAD;
    const innerRx = Rx - INNER_OFF;
    const innerRz = Rz - INNER_OFF;

    const gxMax = Math.ceil(outerRx / VOX) + 1;
    const gzMax = Math.ceil(outerRz / VOX) + 1;

    for (let gx = -gxMax; gx <= gxMax; gx++) {
      for (let gz = -gzMax; gz <= gzMax; gz++) {
        const px = gx * VOX, pz = gz * VOX;

        const dOut = Math.hypot(px / outerRx, pz / outerRz);
        if (dOut > 1.0 + WALL_TOL * VOX) continue;

        const dIn  = Math.hypot(px / innerRx, pz / innerRz);
        if (dIn < 1.0 - WALL_TOL * VOX) continue;

        const th = Math.atan2(px, pz);
        if (Math.abs(th) < GAP) continue;

        const u = (th + Math.PI) / (Math.PI * 2);
        const s = Math.floor(u * NSTR) % NSTR;
        const e = iy - (COAT_NL - 1);
        if (e > strandLen[s]) continue;

        const cell = [gx, gy, gz];
        if (iy < UPPER_CUT) {
          sections.upper.push(cell);
        } else {
          if      (th >= 0 && th < Math.PI / 2)   sections.tailFR.push(cell);
          else if (th >= Math.PI / 2)              sections.tailBR.push(cell);
          else if (th >= -Math.PI / 2 && th < 0)   sections.tailFL.push(cell);
          else                                     sections.tailBL.push(cell);
        }
      }
    }
  }
  return sections;
}

function generateCollarCells() {
  const cells = [];
  const COL_Y0  = Math.round(1.42 / VOX);
  const COL_NL  = 4;
  const COL_GAP = 0.55;
  for (let iy = 0; iy <= COL_NL; iy++) {
    const t  = iy / COL_NL;
    const Rx = 0.120 + 0.025 * t + OUTER_PAD;
    const Rz = 0.092 + 0.020 * t + OUTER_PAD;
    const innerRx = 0.120 + 0.025 * t - 0.035;
    const innerRz = 0.092 + 0.020 * t - 0.035;
    const gy = COL_Y0 + iy;
    const gxMax = Math.ceil(Rx / VOX) + 1;
    const gzMax = Math.ceil(Rz / VOX) + 1;
    for (let gx = -gxMax; gx <= gxMax; gx++) {
      for (let gz = -gzMax; gz <= gzMax; gz++) {
        const px = gx * VOX, pz = gz * VOX;
        if (Math.hypot(px / Rx, pz / Rz) > 1.0 + WALL_TOL * VOX) continue;
        if (Math.hypot(px / innerRx, pz / innerRz) < 1.0 - WALL_TOL * VOX) continue;
        const th = Math.atan2(px, pz);
        if (Math.abs(th) < COL_GAP) continue;
        cells.push([gx, gy, gz]);
      }
    }
  }
  return cells;
}

function buildUpperSleeve() {
  const cells = dedupe([
    ...voxelSolidSphere(0.100, 0.85),
    ...voxelSolidCyl(0.090, 0.083, 0.34, 0)
  ]);
  return cellsToInstanced(cells, COAT_MAT, COAT_BASE, 0.55);
}
function buildLowerSleeve() {
  const cells = dedupe([
    ...voxelSolidCyl(0.083, 0.076, 0.26, 0),
    ...voxelSolidCyl(0.100, 0.105, 0.10, -0.22)
  ]);
  return cellsToInstanced(cells, COAT_MAT, COAT_BASE, 0.55);
}

/* ============================================================
   CHARACTER
   ============================================================ */
const character = new THREE.Group();
character.name = 'Character';
scene.add(character);

const body = new THREE.Group();
character.add(body);

const upper = new THREE.Group();
upper.position.y = 0.90;
body.add(upper);

const mat = (c, r = 0.85, m = 0.05) =>
  new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });

const mSkin  = mat(CHARACTER_CONFIG.skin);
const mHair  = mat(CHARACTER_CONFIG.hair, 0.94);
const mShirt = mat(CHARACTER_CONFIG.shirt, 0.92, 0.03);
const mPants = mat(CHARACTER_CONFIG.pants, 0.94, 0.03);
const mShoes = mat(CHARACTER_CONFIG.shoes, 0.85, 0.12);
const mDark  = mat(0x1a1714, 0.80, 0.15);
const mMetal = mat(0xa8a090, 0.32, 0.9);
const mLens  = new THREE.MeshPhysicalMaterial({
  color: 0x0a0a15, metalness: 1.0, roughness: 0.06,
  emissive: 0x101a30, emissiveIntensity: 0.35,
});

function box(parent, w, h, d, m, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

/* ---------- НОГА ---------- */
const HIP_Y = 0.90, THIGH_L = 0.42, SHIN_L = 0.38, LEG_T = 0.17;

function makeLeg(side) {
  const hip = new THREE.Group();
  hip.position.set(side * 0.09, HIP_Y, 0);
  body.add(hip);
  box(hip, LEG_T, THIGH_L, LEG_T, mPants, 0, -THIGH_L / 2, 0);

  const knee = new THREE.Group();
  knee.position.y = -THIGH_L;
  hip.add(knee);
  box(knee, LEG_T * 0.88, SHIN_L, LEG_T * 0.88, mPants, 0, -SHIN_L / 2, 0);

  const ankle = new THREE.Group();
  ankle.position.y = -SHIN_L;
  knee.add(ankle);
  box(ankle, LEG_T * 1.05, 0.10, LEG_T * 1.7, mShoes, 0, -0.05, LEG_T * 0.30);

  return { hip, knee, ankle };
}
const legR = makeLeg( 1);
const legL = makeLeg(-1);

/* ---------- ТОРС ---------- */
box(upper, 0.36, 0.55, 0.20, mShirt, 0, 0.275, 0);
box(upper, 0.38, 0.05, 0.21, mDark, 0, 0.020, 0);
box(upper, 0.045, 0.035, 0.018, mMetal, 0, 0.020, 0.106);
box(upper, 0.075, 0.10, 0.075, mSkin, 0, 0.600, 0);

/* ---------- РУКА ---------- */
const UPPERARM_L = 0.30, FOREARM_L = 0.28, ARM_T = 0.12;

function makeArm(side) {
  const shoulder = new THREE.Group();
  shoulder.position.set(side * 0.24, 0.55, 0);
  upper.add(shoulder);
  box(shoulder, ARM_T, UPPERARM_L, ARM_T, mShirt, 0, -UPPERARM_L / 2, 0);

  const elbow = new THREE.Group();
  elbow.position.y = -UPPERARM_L;
  shoulder.add(elbow);
  box(elbow, ARM_T * 0.92, FOREARM_L, ARM_T * 0.92, mShirt, 0, -FOREARM_L / 2, 0);

  const hand = new THREE.Group();
  hand.position.y = -FOREARM_L;
  elbow.add(hand);
  box(hand, ARM_T * 0.85, ARM_T * 0.95, ARM_T * 0.90, mSkin, 0, -0.05, 0);
  box(hand, ARM_T * 0.30, ARM_T * 0.55, ARM_T * 0.32, mSkin,
      -side * ARM_T * 0.48, -0.03, ARM_T * 0.22);

  shoulder.add(buildUpperSleeve());
  elbow.add(buildLowerSleeve());

  return { shoulder, elbow, hand };
}
const armR = makeArm( 1);
const armL = makeArm(-1);

/* ---------- ГОЛОВА ---------- */
const headBone = new THREE.Group();
headBone.name = 'Head';
headBone.position.set(0, 0.62, 0);
upper.add(headBone);

const headGroup = new THREE.Group();
headGroup.position.y = 0.13;
headBone.add(headGroup);

const HEAD_SIZE = 0.24;
const res = 7, voxel = HEAD_SIZE / res, half = (res - 1) / 2;
const vGeo = new THREE.BoxGeometry(voxel, voxel, voxel);
const inside = (nx, ny, nz) => {
  const taper = ny < -0.3 ? 0.76 : (ny < 0.1 ? 0.92 : 1.0);
  const mx = 0.86 * taper, mz = 1.00 * taper;
  if (Math.abs(nx) > mx || Math.abs(nz) > mz || Math.abs(ny) > 1.0) return false;
  const c = Math.pow(Math.abs(nx) / mx, 4) + Math.pow(Math.abs(nz) / mz, 4)
          + Math.pow(Math.abs(ny), 4) * 0.55;
  return c <= 1.65;
};
for (let ix = 0; ix < res; ix++)
  for (let iy = 0; iy < res; iy++)
    for (let iz = 0; iz < res; iz++) {
      const nx = (ix - half) / half, ny = (iy - half) / half, nz = (iz - half) / half;
      if (!inside(nx, ny, nz)) continue;
      let m = mSkin;
      const topHair  = ny > 0.55;
      const backHair = nz < -0.25 && ny > -0.3;
      const sideHair = Math.abs(nx) > 0.6 && ny > 0.4;
      if (topHair || backHair || sideHair) m = mHair;
      const v = new THREE.Mesh(vGeo, m);
      v.position.set((ix - half) * voxel, (iy - half) * voxel, (iz - half) * voxel);
      v.castShadow = true; v.receiveShadow = true;
      headGroup.add(v);
    }

const faceZ = HEAD_SIZE * 0.5, eyeY = HEAD_SIZE * 0.06;
const lensW = HEAD_SIZE * 0.32, lensH = HEAD_SIZE * 0.16, frameT = HEAD_SIZE * 0.016;
[-1, 1].forEach(s => {
  const lens = new THREE.Mesh(new THREE.BoxGeometry(lensW, lensH, HEAD_SIZE * 0.02), mLens);
  lens.position.set(s * HEAD_SIZE * 0.21, eyeY, faceZ + 0.008);
  headGroup.add(lens);
  const top = new THREE.Mesh(new THREE.BoxGeometry(lensW + frameT * 2, frameT, HEAD_SIZE * 0.026), mDark);
  top.position.set(s * HEAD_SIZE * 0.21, eyeY + lensH / 2, faceZ + 0.008);
  headGroup.add(top);
  const bot = top.clone(); bot.position.y = eyeY - lensH / 2;
  headGroup.add(bot);
  const outer = new THREE.Mesh(new THREE.BoxGeometry(frameT, lensH, HEAD_SIZE * 0.026), mDark);
  outer.position.set(s * (HEAD_SIZE * 0.21 + lensW / 2), eyeY, faceZ + 0.008);
  headGroup.add(outer);
  const temple = new THREE.Mesh(new THREE.BoxGeometry(HEAD_SIZE * 0.016, HEAD_SIZE * 0.016, HEAD_SIZE * 0.55), mDark);
  temple.position.set(s * HEAD_SIZE * 0.40, eyeY, faceZ - HEAD_SIZE * 0.22);
  headGroup.add(temple);
});
const bridge = new THREE.Mesh(new THREE.BoxGeometry(HEAD_SIZE * 0.10, HEAD_SIZE * 0.02, HEAD_SIZE * 0.026), mDark);
bridge.position.set(0, eyeY + lensH * 0.3, faceZ + 0.008);
headGroup.add(bridge);

const nose = new THREE.Mesh(new THREE.BoxGeometry(HEAD_SIZE * 0.09, HEAD_SIZE * 0.12, HEAD_SIZE * 0.10), mSkin);
nose.position.set(0, 0, faceZ + HEAD_SIZE * 0.03);
nose.castShadow = true;
headGroup.add(nose);

const mouth = new THREE.Mesh(new THREE.BoxGeometry(HEAD_SIZE * 0.13, HEAD_SIZE * 0.014, HEAD_SIZE * 0.02), mDark);
mouth.position.set(0, -HEAD_SIZE * 0.20, faceZ + 0.002);
headGroup.add(mouth);

const mustache = new THREE.Mesh(new THREE.BoxGeometry(HEAD_SIZE * 0.22, HEAD_SIZE * 0.055, HEAD_SIZE * 0.03), mHair);
mustache.position.set(0, -HEAD_SIZE * 0.155, faceZ + 0.006);
headGroup.add(mustache);

const goatee = new THREE.Mesh(new THREE.BoxGeometry(HEAD_SIZE * 0.15, HEAD_SIZE * 0.17, HEAD_SIZE * 0.055), mHair);
goatee.position.set(0, -HEAD_SIZE * 0.33, faceZ - 0.012);
headGroup.add(goatee);

[-1, 1].forEach(s => {
  const sb = new THREE.Mesh(new THREE.BoxGeometry(HEAD_SIZE * 0.03, HEAD_SIZE * 0.20, HEAD_SIZE * 0.05), mHair);
  sb.position.set(s * HEAD_SIZE * 0.40, 0, faceZ - HEAD_SIZE * 0.12);
  headGroup.add(sb);
  const ear = new THREE.Mesh(new THREE.BoxGeometry(HEAD_SIZE * 0.055, HEAD_SIZE * 0.19, HEAD_SIZE * 0.13), mSkin);
  ear.position.set(s * HEAD_SIZE * 0.47, 0, 0);
  ear.castShadow = true;
  headGroup.add(ear);
});

/* ============================================================
   ПЛАЩ СО СКЕЛЕТОМ
   ============================================================ */
const TAIL_TOP_Y = (Y_TOP_G - UPPER_CUT) * VOX;    // 0.884 — стык верха и пол

const coatSections = generateCoatCells();
const collarCells  = generateCollarCells();

const coatUpperBone = new THREE.Group();
coatUpperBone.name = 'CoatUpper';
coatUpperBone.position.y = -0.90;
upper.add(coatUpperBone);
coatUpperBone.add(cellsToInstanced(coatSections.upper, COAT_MAT, COAT_BASE, 0.55));
coatUpperBone.add(cellsToInstanced(collarCells, COAT_MAT, COLLAR_BASE, 0.45));

function makeCoatTail(name, cells) {
  const bone = new THREE.Group();
  bone.name = name;
  bone.position.set(0, TAIL_TOP_Y, 0);
  body.add(bone);

  const wrap = new THREE.Group();
  wrap.position.y = -TAIL_TOP_Y;
  bone.add(wrap);
  wrap.add(cellsToInstanced(cells, COAT_MAT, COAT_BASE, 0.55));
  return bone;
}

const coatTailFR = makeCoatTail('CoatTailFR', coatSections.tailFR);
const coatTailFL = makeCoatTail('CoatTailFL', coatSections.tailFL);
const coatTailBR = makeCoatTail('CoatTailBR', coatSections.tailBR);
const coatTailBL = makeCoatTail('CoatTailBL', coatSections.tailBL);

/* ============================================================
   INPUT
   ============================================================ */
const keys = Object.create(null);
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

const state = {
  speed: 0, phase: 0, moveBlend: 0,
  crouch: 0, crouchTarget: 0,
  sprint: 0, sprintTarget: 0,
  air: 0, grounded: true, vy: 0,
  baseY: 0, turnVel: 0,
};

/* ============================================================
   LOOP
   ============================================================ */
const clock = new THREE.Clock();

function update(dt, t) {
  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp)    iz -= 1;
  if (keys.KeyS || keys.ArrowDown)  iz += 1;
  if (keys.KeyA || keys.ArrowLeft)  ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;

  const crouchKey = !!(keys.ControlLeft || keys.ControlRight || keys.KeyC);
  const sprintKey = !!(keys.ShiftLeft || keys.ShiftRight);
  const hasInput  = (ix !== 0 || iz !== 0);

  const camFwd = new THREE.Vector3();
  camera.getWorldDirection(camFwd);
  camFwd.y = 0;
  if (camFwd.lengthSq() < 1e-6) camFwd.set(0, 0, -1);
  camFwd.normalize();
  const camRight = new THREE.Vector3()
    .crossVectors(camFwd, new THREE.Vector3(0, 1, 0)).normalize();

  const moveDir = new THREE.Vector3();
  if (hasInput) moveDir.addScaledVector(camFwd, -iz).addScaledVector(camRight, ix).normalize();

  state.crouchTarget = (crouchKey && state.grounded) ? 1 : 0;
  state.sprintTarget = (sprintKey && hasInput && !crouchKey && state.grounded) ? 1 : 0;

  state.crouch += (state.crouchTarget - state.crouch) * Math.min(1, dt * 9);
  state.sprint += (state.sprintTarget - state.sprint) * Math.min(1, dt * 6);

  const baseSpeed = 1.55 * (1 - 0.55 * state.crouch);
  const maxSpeed  = baseSpeed * (1 + state.sprint * 1.20);
  const targetSpeed = hasInput ? maxSpeed : 0;
  state.speed += (targetSpeed - state.speed) * Math.min(1, dt * 9);

  const prevYaw = character.rotation.y;
  if (hasInput) {
    const targetYaw = Math.atan2(moveDir.x, moveDir.z);
    let d = targetYaw - character.rotation.y;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    character.rotation.y += d * Math.min(1, dt * 11);
  }
  let dy = character.rotation.y - prevYaw;
  dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  state.turnVel += ((dy / Math.max(dt, 1e-4)) - state.turnVel) * Math.min(1, dt * 8);

  if (state.speed > 0.002) {
    const fwd = new THREE.Vector3(
      Math.sin(character.rotation.y), 0, Math.cos(character.rotation.y)
    );
    character.position.addScaledVector(fwd, state.speed * dt);
  }

  if (keys.Space && state.grounded) {
    state.vy = 4.2;
    state.grounded = false;
  }
  if (!state.grounded) {
    state.vy -= 13.5 * dt;
    state.baseY += state.vy * dt;
    if (state.baseY <= 0) { state.baseY = 0; state.vy = 0; state.grounded = true; }
  }
  state.air += ((state.grounded ? 0 : 1) - state.air) * Math.min(1, dt * 12);

  if (state.grounded) {
    const cadence = 5.2 + state.sprint * 3.6;
    state.phase += dt * cadence * Math.min(1.4, state.speed / 1.3);
  }
  const blendTarget = state.speed > 0.08 ? Math.min(1, state.speed / 1.1) : 0;
  state.moveBlend += (blendTarget - state.moveBlend) * Math.min(1, dt * 10);

  const p     = state.phase;
  const moveB = state.moveBlend;
  const c     = state.crouch;
  const air   = state.air;
  const sp    = state.sprint;

  /* ---- НОГИ ---- */
  const legAmp  = (0.55 + 0.20 * sp) * moveB * (1 - 0.30 * c);
  const kneeAmp = (0.75 + 0.30 * sp) * moveB * (1 - 0.25 * c);

  const crouchHip  = -0.85 * c;
  const crouchKnee =  1.55 * c;
  const airHip     = -0.45 * air;
  const airKnee    =  0.85 * air;

  const hipR  = -legAmp * Math.sin(p);
  const hipL  = -legAmp * Math.sin(p + Math.PI);

  const kneeR = Math.max(0, kneeAmp * Math.sin(p + 0.9)) + 0.06;
  const kneeL = Math.max(0, kneeAmp * Math.sin(p + 0.9 + Math.PI)) + 0.06;

  legR.hip.rotation.x   = hipR  + crouchHip  + airHip;
  legL.hip.rotation.x   = hipL  + crouchHip  + airHip;
  legR.knee.rotation.x  = kneeR + crouchKnee + airKnee;
  legL.knee.rotation.x  = kneeL + crouchKnee + airKnee;

  legR.ankle.rotation.x = -(legR.hip.rotation.x + legR.knee.rotation.x) * 0.85;
  legL.ankle.rotation.x = -(legL.hip.rotation.x + legL.knee.rotation.x) * 0.85;

  /* ---- РУКИ ---- */
  const armAmp   = (0.40 + 0.24 * sp) * moveB * (1 - 0.30 * c);
  const elbowAmp = (0.35 + 0.30 * sp) * moveB;

  const shoulderR = armAmp * Math.sin(p);
  const shoulderL = armAmp * Math.sin(p + Math.PI);

  const elbowR = -0.15 - elbowAmp * Math.max(0, -Math.sin(p))     - 0.35 * air - 0.20 * c;
  const elbowL = -0.15 - elbowAmp * Math.max(0, -Math.sin(p + Math.PI)) - 0.35 * air - 0.20 * c;

  armR.shoulder.rotation.x = shoulderR - 0.12 * c - 0.55 * air;
  armL.shoulder.rotation.x = shoulderL - 0.12 * c - 0.55 * air;
  armR.shoulder.rotation.z =  0.05 + 0.05 * sp + 0.12 * air;
  armL.shoulder.rotation.z = -0.05 - 0.05 * sp - 0.12 * air;
  armR.elbow.rotation.x = elbowR;
  armL.elbow.rotation.x = elbowL;

  /* ---- ТОРС / ГОЛОВА ---- */
  upper.rotation.x = 0.10 * moveB * (1 + sp * 0.9) + 0.20 * c;
  upper.rotation.z = Math.sin(p * 2) * 0.012 * moveB;

  headBone.rotation.x = -upper.rotation.x * 0.55;
  headBone.rotation.y = Math.sin(t * 0.55) * 0.03 * (1 - moveB);

  /* ---- ПОЛЫ ПЛАЩА — откидываются НАЗАД ---- */
  const speedFactor = Math.min(1, state.speed / 1.8);
  const lagBack = 0.45 * speedFactor * (1 + sp * 0.45);
  const sideLag = THREE.MathUtils.clamp(state.turnVel * 0.22, -0.35, 0.35);

  const swayZ = Math.sin(p * 2)     * 0.06 * moveB;
  const swayY = Math.sin(p * 2 + 1) * 0.04 * moveB;
  const airFlare = 0.55 * air;

  coatTailFR.rotation.x = lagBack * 1.15 + Math.sin(p * 2 + 0.3) * 0.07 * moveB + airFlare * 0.6;
  coatTailFR.rotation.z = sideLag * 1.10 + swayZ * 0.5 + 0.03;
  coatTailFR.rotation.y = swayY * 0.5;

  coatTailFL.rotation.x = lagBack * 1.15 + Math.sin(p * 2 + 0.6) * 0.07 * moveB + airFlare * 0.6;
  coatTailFL.rotation.z = sideLag * 1.10 + swayZ * 0.5 - 0.03;
  coatTailFL.rotation.y = -swayY * 0.5;

  coatTailBR.rotation.x = lagBack * 0.95 + Math.sin(p * 2 + 0.9) * 0.09 * moveB + airFlare * 0.45;
  coatTailBR.rotation.z = sideLag * 0.90 + swayZ * 0.6 + 0.03;
  coatTailBR.rotation.y = swayY * 0.6;

  coatTailBL.rotation.x = lagBack * 0.95 + Math.sin(p * 2 + 1.2) * 0.09 * moveB + airFlare * 0.45;
  coatTailBL.rotation.z = sideLag * 0.90 + swayZ * 0.6 - 0.03;
  coatTailBL.rotation.y = -swayY * 0.6;

  /* ---- ВЕРТИКАЛЬНОЕ СМЕЩЕНИЕ ---- */
  const legLift = (Math.abs(hipR) + Math.abs(hipL)) * 0.08;
  const bob     = Math.sin(p * 2) * 0.012 * moveB;
  const breath  = Math.sin(t * 1.4) * 0.006 * (1 - moveB);

  body.position.y  = -0.30 * c - legLift + bob + breath;
  character.position.y = state.baseY;

  const desired = new THREE.Vector3(
    character.position.x,
    character.position.y * 0.5 + 1.0,
    character.position.z
  );
  const delta = desired.sub(controls.target).multiplyScalar(1 - Math.pow(0.0015, dt));
  controls.target.add(delta);
  camera.position.add(delta);
}

function animate() {
  const dt = Math.min(clock.getDelta(), 0.033);
  const t  = clock.elapsedTime;
  update(dt, t);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
